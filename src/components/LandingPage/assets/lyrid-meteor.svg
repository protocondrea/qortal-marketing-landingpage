    <circle cx="1258" cy="421" r="14" fill="#eaffff"/>
    <circle cx="1258" cy="421" r="38" fill="#20d8ff" opacity="0.22"/>
  </g>
  <path d="M1320 520 C1470 374 1610 430 1700 300 C1780 376 1860 336 1976 438 V547 H1320 Z" fill="#07101c" opacity="0.86"/>
  <path d="M0 547 C146 410 294 428 450 515 C560 575 636 492 760 547 Z" fill="#07101c" opacity="0.9"/>
  <g filter="url(#softText)">
