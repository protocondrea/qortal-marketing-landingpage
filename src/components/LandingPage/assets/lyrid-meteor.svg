    <circle cx="1192" cy="68" r="2.4" fill="#dffcff"/>
    <circle cx="875" cy="86" r="1.8" fill="#eafcff"/>
    <circle cx="1430" cy="120" r="1.8" fill="#eafcff"/>
    <circle cx="1600" cy="66" r="1.4" fill="#c2f2ff"/>
    <circle cx="1788" cy="132" r="1.8" fill="#bdeeff"/>
    <circle cx="1350" cy="218" r="1.4" fill="#dffcff"/>
    <circle cx="1020" cy="262" r="1.4" fill="#c2f2ff"/>
  </g>
  <g filter="url(#glow)">
    <path d="M1250 425 C1330 290 1446 196 1622 68 C1475 196 1370 306 1262 431 Z" fill="url(#meteor)" opacity="0.96"/>
    <path d="M1265 420 C1420 274 1598 144 1910 8" fill="none" stroke="#3edfff" stroke-width="3" opacity="0.34"/>
