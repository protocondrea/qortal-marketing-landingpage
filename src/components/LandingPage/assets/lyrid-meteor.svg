<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1976 547" role="img" aria-label="Lyrid Meteor, when the sky breaks">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020812"/>
      <stop offset="0.45" stop-color="#041421"/>
      <stop offset="0.72" stop-color="#07192a"/>
      <stop offset="1" stop-color="#02050b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.42" stop-color="#13baca"/>
      <stop offset="1" stop-color="#00606d"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#faffff"/>
      <stop offset="0.18" stop-color="#62f4ff"/>
      <stop offset="0.38" stop-color="#05a9d6"/>
      <stop offset="0.64" stop-color="#f2a355"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softText" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1976" height="547" rx="18" fill="url(#sky)"/>
  <rect x="58" width="20" height="547" fill="#079aa5" opacity="0.86"/>
  <rect x="80" width="5" height="547" fill="#6af7ff" opacity="0.25"/>
